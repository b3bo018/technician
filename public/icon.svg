<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Radar Tracking concentric arcs -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 16" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 12" opacity="0.8" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 8" opacity="0.5" />

  <!-- Center Pin Icon (Red) -->
  <g transform="translate(256, 210) scale(3.4) translate(-12, -15)">
    <path
      d="M12 0C5.37 0 0 5.37 0 12C0 21 12 30 12 30C12 30 24 21 24 12C24 5.37 18.63 0 12 0Z"
      fill="url(#redGrad)"
    />
    <circle cx="12" cy="11" r="4.5" fill="#ffffff" />
  </g>

  <!-- Chevrons >< beneath pin -->
  <g transform="translate(256, 360)">
    <!-- Left chevron (Slate) -->
    <path d="M -40 -18 L -64 0 L -40 18 L -52 18 L -76 0 L -52 -18 Z" fill="#94a3b8" />
    <!-- Right chevron (Green) -->
    <path d="M 40 -18 L 64 0 L 40 18 L 52 18 L 76 0 L 52 -18 Z" fill="url(#greenGrad)" />
  </g>
</svg>
