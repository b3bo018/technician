name: Build workday location web assets
on:
  push:
    branches: [fix/android-aws-location-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://connect.securetrackgo.com
      VITE_SYNC_INTERVAL_MS: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:firebase
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: workday-location-web
          path: dist/
          retention-days: 7
