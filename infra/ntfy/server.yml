base-url: "https://push.securetrackgo.com"
listen-http: "127.0.0.1:2586"
behind-proxy: true
proxy-trusted-hosts: "127.0.0.1"
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"
web-root: "disable"
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
# UnifiedPush topics are random per installation and messages are Web Push encrypted.
# Permit anonymous read/write only on ntfy's reserved UnifiedPush topic prefix.
auth-access:
  - "*:up*:rw"
